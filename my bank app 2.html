<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="bank app 1.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol style="font-size: 1.5em;">
        
            <div style="margin: 30px 0; text-align: center;">
                <b style="font-size: 1.1em;">Bank App</b><br><br>
                <label for="amount">Enter Transaction Amount</label>
                <input type="number" id="amount" style="margin-left: 10px; width: 200px;" />
                <br><br>
                <button id="creditBtn" style="margin-right: 10px; padding: 6px 18px; background: #444; color: #fff; border: none; border-radius: 4px;">Credit</button>
                <button style="padding: 6px 18px; background: #444; color: #fff; border: none; border-radius: 4px;">Debit</button>
                <br><br>
                <span id="balance" style="color: #555; font-size: 0.9em;">Your Account Balance is : Rs.0</span>
            </div>
        </li>
        
    </ol>
    <script>
    let balance = 0;
    document.getElementById('creditBtn').onclick = function() {
        let amount = parseInt(document.getElementById('amount').value) || 0;
        balance += amount;
        document.getElementById('balance').innerHTML = 'Your Account Balance is : Rs.' + balance;
    };
    </script>
</body>
</html>
